[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-project"
version = "2.0.0"
description = "Shared ML transformers and preprocessing for Bangalore house price ML"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "category-encoders>=2.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ml_project*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]
asyncio_mode = "auto"
